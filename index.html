<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodePack — Local Codebase Ingestion</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="drop-overlay" class="drop-overlay hidden">
        <div class="drop-content">
            <h2 style="display: none;">Drop your files and folders here!!</h2>
        </div>
    </div>

    <div class="app-container">
        <!-- header -->
        <header class="app-header">
            <div class="logo">
                <span class="icon">📦</span>
                <h1>Codepacker</h1>
            </div>
            <p class="tagline">Pack your codebase into an LLM-ready text file — 100% locally in your browser.</p>
        </header>

        <!-- Top control bar -->
        <section class="top-bar">
            <div id="drop-zone" class="drop-zone">
                <span class="upload-icon">📁</span>
                <span>Drag & Drop Project Folder OR</span>
                <label class="btn-browse">
                    Browse Directory
                    <input type="file" id="folder-input" webkitdirectory directory multiple hidden>
                </label>
            </div>

            <div class="summary-stats" id="summary-stats">
                <div class="stat-item">Files: <strong id="stat-files">0</strong></div>
                <div class="stat-item">Included: <strong id="stat-included">0</strong></div>
            </div>
        </section>

        <!-- Filters -->
        <div class="filter-bar">
            <label class="checkbox-label">
                <input type="checkbox" id="smart-filter" checked>
                Apply smart filtering (exclude .env, node_modules, etc.)
            </label>
        </div>

        <!-- Main split workspace -->
        <main class="workspace">
            <!-- Directory Tree -->
            <section class="panel tree-panel">
                <div class="panel-header">
                    <h2>Directory Structure</h2>
                    <button id="copy-tree-btn" class="btn-sm" disabled>📋 Copy Tree</button>
                </div>

                <!-- Tab Controls for Tree View  -->
                <div class="view-tabs">
                    <button class="tab-btn active" data-view="tree">ASCII Tree</button>
                    <button class="tab-btn" data-view="file-list-view">File List View</button>
                </div>

                <div id="tree-view" class="tab-content active">
                    <pre id="ascii-tree-preview" class="code-preview">No directory loaded yet.</pre>
                </div>

                <div id="file-list-view" class="tab-content">
                    <div id="file-list" class="file-list">
                        <p class="placeholder-text">No folder loaded yet.</p>
                    </div>
                </div>
            </section>

            <!-- Right Side: Processed File content -->
            <section class="panel control-panel">
                <div class="panel-header">
                    <h2>File Contents</h2>
                    <div class="action-buttons">
                        <button id="copy-btn" class="btn-primary" disabled>📋 Copy Content</button>
                        <button id="download-btn" class="btn-secondary" disabled>💾 Download .txt</button>
                    </div>
                </div>
                <textarea name="" id="output-preview" readonly
                    placeholder="Parsed File Content will appear here..."></textarea>
            </section>
        </main>
    </div>
    <script type="module" src="js/main.js"></script>
</body>

</html>
